[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pympesa"
version = "2.0.0"
description = "Modern Python client for Safaricom M-PESA Daraja API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.9"
authors = [
    {name = "Andrew Kamau", email = "andkamau@gmail.com"}
]
keywords = ["mpesa", "daraja", "safaricom", "mobile-money", "kenya", "payments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["requests>=2.28.0"]

[project.optional-dependencies]
cli = ["click>=8.1.0", "rich>=13.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
pympesa = "pympesa.cli:main"

[project.urls]
Homepage = "https://github.com/pythias-io/pympesa"
Documentation = "https://github.com/pythias-io/pympesa#readme"
Repository = "https://github.com/pythias-io/pympesa"
Issues = "https://github.com/pythias-io/pympesa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pympesa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pympesa"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
